name: Twice-Daily Autonomous Shorts Publisher

on:
  schedule:
    - cron: '0 6,18 * * *'  # Runs twice daily at 06:00 UTC and 18:00 UTC (11:30 AM & 11:30 PM IST)
  workflow_dispatch:        # Allows manual trigger button from GitHub Web UI

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-api-python-client google-auth google-auth-oauthlib requests instagrapi python-dotenv

      - name: Run Pipeline & Publish Video
        env:
          # YouTube API Secrets
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          
          # Instagram Secrets (Direct login & Meta Graph)
          INSTA_USERNAME: ${{ secrets.INSTA_USERNAME }}
          INSTA_PASSWORD: ${{ secrets.INSTA_PASSWORD }}
          INSTA_SESSION_DATA: ${{ secrets.INSTA_SESSION_DATA }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          
          # Optional LLM Topic Generation
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python auto_poster.py --platforms youtube instagram

      - name: Commit Updated Pipeline & 7-Day Posted Archive
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_log.json output/pipeline output/posted
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update pipeline queue and 7-day posted archive [skip ci]" && git push)
