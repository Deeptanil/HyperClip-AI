name: Intelligent Multi-Slot Shorts Publisher

on:
  schedule:
    - cron: '*/30 * * * *'  # Runs 48 times daily (every 30 minutes, 24/7 continuous pipeline)
  workflow_dispatch:
    inputs:
      force:
        description: 'Force publish immediately (bypass IST peak window and daily quota checks)'
        required: false
        type: boolean
        default: false

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Working Branch (master)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-api-python-client google-auth google-auth-oauthlib requests instagrapi python-dotenv

      - name: Sync Media Queue from Content Branch
        run: |
          git fetch origin content
          # Populate output/ and state logs from dedicated content branch
          git checkout origin/content -- output/ posted_log.json posted_twitch_log.json clipper_state.json 2>/dev/null || true

      - name: Run Intelligent Pipeline
        env:
          # YouTube API Secrets
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          
          # Instagram Secrets (Direct login, session & Meta Graph for Slot 1 and Slot 2)
          INSTA_USERNAME: ${{ secrets.INSTA_USERNAME }}
          INSTA_PASSWORD: ${{ secrets.INSTA_PASSWORD }}
          INSTA_SESSION_DATA: ${{ secrets.INSTA_SESSION_DATA }}
          INSTA_USERNAME_2: ${{ secrets.INSTA_USERNAME_2 }}
          INSTA_PASSWORD_2: ${{ secrets.INSTA_PASSWORD_2 }}
          INSTA_SESSION_DATA_2: ${{ secrets.INSTA_SESSION_DATA_2 }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          
          # LLM Topic Generation
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python auto_poster.py --platforms youtube instagram --force
          else
            python auto_poster.py --platforms youtube instagram
          fi

      - name: Commit Content Updates to Dedicated 'content' Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Switch exclusively to content branch (master is never modified by actions)
          git checkout -B content origin/content
          mkdir -p output/stream_pipeline output/stream_posted output/pipeline output/posted
          git add -A posted_log.json posted_twitch_log.json clipper_state.json output/pipeline output/posted output/stream_pipeline output/stream_posted
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(content): automated check and archive update [skip ci]" && git pull --rebase origin content && git push origin content)
